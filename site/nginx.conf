server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The docs are public, static and immutable per deploy.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

    # --- security headers -------------------------------------------------
    # The page loads laka.css / laka.js from the design-system CDN and calls
    # the API from the explorer; nothing else is permitted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://designsystem.bowtiekreative.com; style-src 'self' https://designsystem.bowtiekreative.com; img-src 'self' https://designsystem.bowtiekreative.com data:; connect-src 'self' https://api.digitalstemcell.bowtiekreative.com; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Serve /reference for /reference.html too.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
